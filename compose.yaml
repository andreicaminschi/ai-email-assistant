services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      target: app
    env_file: .env
    secrets:
      - gmail_token
      - calendar_token
      - llm_api_key
    volumes:
      - agent-data:/data

  wrapper:
    build:
      context: .
      dockerfile: Containerfile
      target: wrapper
    profiles:
      - dev
    secrets:
      - claude_token

secrets:
  gmail_token:
    file: ./secrets/gmail_token
  calendar_token:
    file: ./secrets/calendar_token
  llm_api_key:
    file: ./secrets/llm_api_key
  claude_token:
    file: ./secrets/claude_token

volumes:
  agent-data:

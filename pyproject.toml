[project]
name = "email-agent"
version = "0.1.0"
description = "AI email and calendar assistant"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[anthropic,openai]",
    "google-api-python-client",
    "google-auth-oauthlib",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.40.0",
    "pydantic-evals>=2.71.0",
    "pyright",
    { include-group = "wrapper" },
]
wrapper = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["email_agent", "wrapper"]

[tool.pyright]
include = ["src", "scripts", "evals"]
typeCheckingMode = "strict"
